<!DOCTYPE html>
<html lang="ja">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>会話整理メモ</title>
  <link rel="stylesheet" href="style.css">
</head>

<body>

  <div class="container">
    <h1>会話整理メモ</h1>

    <div class="form-group">
      <label>何があった？</label>
      <textarea id="situation"></textarea>
    </div>

    <div class="form-group">
      <label>相手はどう感じた？</label>
      <textarea id="feeling"></textarea>
    </div>

    <div class="form-group">
      <label>なぜその行動をした？</label>
      <textarea id="reason"></textarea>
    </div>

    <div class="form-group">
      <label>次どうする？</label>
      <textarea id="nextAction"></textarea>
    </div>

    <label>タグ</label>
    <input type="text" id="tag">
    <br>
    <label>感情</label>
    <select id="emotion">
      <option value="">感情を選択</option>
      <option value="😢 悲しい">😢 悲しい</option>
      <option value="😡 イライラ">😡 イライラ</option>
      <option value="😰 不安">😰 不安</option>
      <option value="😞 落ち込み">😞 落ち込み</option>
      <option value="😊 良かった">😊 良かった</option>
    </select>
    <br>
    <input type="text" id="searchInput" placeholder="検索">
    <button id="cleartag" onclick="clearTag()">すべて表示</button>
    <button id="saveBtn">保存</button>

    <div class="logHeader">
      <h2 class="pastLog">過去ログ</h2>
      <p id="currentTag"></p>
    </div>
    <div id="memoList"></div>
  </div>

  <script src="script.js"></script>
</body>

</html>
